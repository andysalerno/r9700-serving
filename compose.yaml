x-vllm-full-cache-volumes: &vllm_full_cache_volumes
  - ./chat-templates/:/app/chat-templates:Z
  - ${HOME}/.cache/huggingface:/root/.cache/huggingface:Z
  - ${HOME}/.cache/vllm:/root/.cache/vllm:Z
  - ${HOME}/.cache/triton:/root/.cache/triton:Z
  - ${HOME}/.cache/triton:/root/.triton:Z
  - ${HOME}/.cache/torchinductor:/root/.cache/torchinductor:Z
  - ${HOME}/.cache/aiter:/root/.aiter:Z
  - ${HOME}/.cache/comgr:/root/.cache/comgr:Z
  - ${HOME}/.cache/tvm-ffi:/root/.cache/tvm-ffi:Z

x-llamacpp-cache-volumes: &llamacpp_cache_volumes
  - ${HOME}/.cache/huggingface:/root/.cache/huggingface:Z
  - ${HOME}/.cache/llama.cpp:/root/.cache/llama.cpp:Z

x-amd-devices: &amd_devices
  devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
  group_add:
    - "video"
  cap_add:
    - SYS_PTRACE
  security_opt:
    - label=disable
  ipc: host

services:
  vllm:
    <<: *amd_devices
    # image: vllm/vllm-openai-rocm:v0.25.1
    # image: docker.io/rocm/vllm:rocm7.14.0_rdna_ubuntu24.04_py3.14_pytorch_2.11.0_vllm_0.23.0
    image: localhost/vllm-fullbuild:latest
    build:
      context: .
      dockerfile: Dockerfile.fullbuild
      args:
        ROCM_IMAGE: ${ROCM_IMAGE}
        GPU_ARCH: ${GPU_ARCH}
        MAX_JOBS: ${MAX_JOBS}
        TORCH_VERSION: ${TORCH_VERSION}
        TORCHVISION_VERSION: ${TORCHVISION_VERSION}
        TORCHAUDIO_VERSION: ${TORCHAUDIO_VERSION}
        VLLM_REF: ${VLLM_REF}
        VLLM_VERSION: ${VLLM_VERSION}
        AITER_REF: ${AITER_REF}
        FLASH_ATTN_REF: ${FLASH_ATTN_REF}
    container_name: vllm
    ports:
      - "8000:8000"
    networks:
      default:
        aliases:
          - llm-backend
    volumes: *vllm_full_cache_volumes
    env_file:
      - env/2xr9700.vllm.common
      - env/aiter-unified-attention.env
    environment:
      - GPU_MAX_HW_QUEUES=1
      - NCCL_P2P_DISABLE=1
      # --chat-template /app/chat-templates/qwen36.jinja
    command: >
      Qwen/Qwen3.8-27B-FP8
      --tokenizer Qwen/Qwen3.8-27B
      --served-model-name qwen3.8-27b
      --limit-mm-per-prompt '{"image": 25, "audio": 0, "video": 0}'
      --enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser qwen3
      --default-chat-template-kwargs '{"preserve_thinking": true}'
      --max-model-len 128000
      --enable-prefix-caching
      --override-generation-config '{"temperature": 1.0, "top_p": 0.95, "top_k": 20, "min_p": 0.0, "presence_penalty": 0.0, "repetition_penalty": 1.0}'
      --gpu-memory-utilization 0.93
      --host 0.0.0.0
      --port 8000
      --dtype auto
      --max-num-seqs 4
      --kv-cache-dtype fp8
      -tp 2
      --attention-backend ROCM_AITER_UNIFIED_ATTN
      --speculative-config '{"method": "mtp", "num_speculative_tokens": 3, "attention_backend": "ROCM_AITER_UNIFIED_ATTN"}'

  ##########
  # tools and dashboards
  ##########

  chatui:
    image: ghcr.io/huggingface/chat-ui-db:latest
    container_name: chatui
    ports:
      - "8001:3000"
    environment:
      - OPENAI_BASE_URL=http://llm-backend:8000/v1
      - OPENAI_API_KEY=sk-empty
      - COOKIE_SECURE=false
      - PUBLIC_ORIGIN=http://hirose.local:8001
    volumes:
      - chat-ui-data:/data

volumes:
  chat-ui-data:

