services:
  vllm-rocm-wheel-nightly:
    profiles: ["vllm-rocm-wheel-nightly"]
    image: localhost/vllm-rocm-wheel-nightly
    # image: docker.io/vllm/vllm-openai-rocm:nightly
    build:
      context: .
      dockerfile: docker/Dockerfile.wheel
      args:
        GFX_TARGET: gfx120X-all
        GFX_ARCH: gfx1201
        PYTHON: python3.12
        VLLM_WHEEL_URL: https://wheels.vllm.ai/rocm/nightly/rocm723
        VLLM_VERSION: 0.22.1rc1.dev480+g6e4a54717.rocm723
        ROCM_WHEEL_INDEX_URL: "${ROCM_WHEEL_INDEX_URL-https://rocm.nightlies.amd.com/whl-multi-arch/}"
        ROCM_SDK_CORE_VERSION: "${ROCM_SDK_CORE_VERSION-7.14.0a20260606}"
        ROCM_SDK_LIBRARIES_VERSION: "${ROCM_SDK_LIBRARIES_VERSION-7.14.0a20260606}"
        ROCM_SDK_LIBRARIES_PACKAGE: "${ROCM_SDK_LIBRARIES_PACKAGE-rocm-sdk-libraries}"
        ROCM_SDK_DEVICE_PACKAGE: "${ROCM_SDK_DEVICE_PACKAGE-rocm-sdk-device-gfx1201}"
        ROCM_SDK_LIBRARIES_DIR: "${ROCM_SDK_LIBRARIES_DIR-_rocm_sdk_libraries}"
        FLASH_ATTN_VERSION: 2.8.3
    container_name: vllm-rocm-wheel-nightly
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "video"
      # - "render"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - label=disable
    ipc: host
    ports:
      - "8000:8000"
    # depends_on:
    #   - aspire-dashboard
    networks:
      default:
        aliases:
          - llm-backend
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface:Z
      - ./chat-templates/:/app/chat-templates:Z
      - ${HOME}/.cache/vllm:/root/.cache/vllm:Z
      - ${HOME}/.cache/triton:/root/.cache/triton:Z
      - ${HOME}/.cache/torchinductor:/root/.cache/torchinductor:Z
    env_file:
      - .env/2xr9700.vllm.common
      - .env/otel.common
    # environment:
    #   - FLASH_ATTENTION_TRITON_AMD_ENABLE=TRUE
    command: >
      Qwen/Qwen3.6-27B-FP8
      --tokenizer Qwen/Qwen3.6-27B
      --served-model-name qwen3.6-27b
      --chat-template /app/chat-templates/qwen36.jinja
      --limit-mm-per-prompt '{"image": 99, "audio": 0, "video": 0}'
      --enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser qwen3
      --max-model-len 128000
      --enable-prefix-caching
      --override-generation-config '{"temperature": 1.0, "top_p": 0.95, "top_k": 20, "min_p": 0.0, "presence_penalty": 0.0, "repetition_penalty": 1.0}'
      --gpu-memory-utilization 0.93
      --host 0.0.0.0
      --port 8000

      --dtype auto
      --max-num-seqs 4
      --kv-cache-dtype fp8
      --speculative-config '{"method": "mtp", "num_speculative_tokens": 3}'
      -tp 2

  vllm-rocm-wheel-gfx12x-patched:
    profiles: ["vllm-rocm-wheel-gfx12x-patched"]
    image: localhost/vllm-rocm-wheel-gfx12x-patched
    build:
      context: .
      dockerfile: docker/Dockerfile.wheel-gfx12x-patched
      args:
        BASE_IMAGE: localhost/vllm-rocm-wheel-nightly
        ROCM_WHEEL_INDEX_URL: "${ROCM_WHEEL_INDEX_URL-https://rocm.nightlies.amd.com/whl-multi-arch/}"
        ROCM_SDK_DEVEL_VERSION: "${ROCM_SDK_DEVEL_VERSION-7.14.0a20260606}"
        ROCM_SDK_LIBRARIES_DIR: "${ROCM_SDK_LIBRARIES_DIR-_rocm_sdk_libraries}"
        USE_LATEST_AITER: "${USE_LATEST_AITER-0}"
        AITER_LATEST_WHEEL_URL:
        AITER_LATEST_WHEEL_FILENAME:
        AITER_LATEST_FLYDSL_WHEEL_URL:
        AITER_LATEST_FLYDSL_WHEEL_FILENAME:
    container_name: vllm-rocm-wheel-gfx12x-patched
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "video"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - label=disable
    ipc: host
    ports:
      - "8000:8000"
    # depends_on:
    #   - aspire-dashboard
    networks:
      default:
        aliases:
          - llm-backend
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface:Z
      - ./chat-templates/:/app/chat-templates:Z
      - ${HOME}/.cache/vllm:/root/.cache/vllm:Z
      - ${HOME}/.cache/triton:/root/.cache/triton:Z
      - ${HOME}/.cache/torchinductor:/root/.cache/torchinductor:Z

    env_file:
      - .env/2xr9700.vllm.common
      - .env/otel.common
    environment:
      - VLLM_ROCM_USE_AITER=1
      - VLLM_ROCM_USE_AITER_MHA=0
      - VLLM_ROCM_USE_AITER_MLA=0
      - VLLM_ROCM_USE_AITER_MOE=0
      - VLLM_ROCM_USE_AITER_LINEAR=0
      - VLLM_ROCM_USE_AITER_FP8BMM=0
      - VLLM_ROCM_USE_AITER_FP4BMM=0
      - VLLM_ROCM_USE_AITER_TRITON_GEMM=0
      - VLLM_ROCM_USE_AITER_RMSNORM=0
      - VLLM_ROCM_USE_AITER_UNIFIED_ATTENTION=1
      - VLLM_ROCM_SHUFFLE_KV_CACHE_LAYOUT=0
      - ROCM_PATH=/opt/vllm/lib/python3.12/site-packages/_rocm_sdk_devel
      - ROCM_HOME=/opt/vllm/lib/python3.12/site-packages/_rocm_sdk_devel
      - HIP_PATH=/opt/vllm/lib/python3.12/site-packages/_rocm_sdk_devel
      - HIP_HOME=/opt/vllm/lib/python3.12/site-packages/_rocm_sdk_devel
      - HIP_DEVICE_LIB_PATH=/opt/vllm/lib/python3.12/site-packages/_rocm_sdk_devel/lib/llvm/amdgcn/bitcode
      - DEVICE_LIB_PATH=/opt/vllm/lib/python3.12/site-packages/_rocm_sdk_devel/lib/llvm/amdgcn/bitcode
      - CPATH=/opt/vllm/lib/python3.12/site-packages/_rocm_sdk_devel/include
      - LIBRARY_PATH=/opt/vllm/lib/python3.12/site-packages/_rocm_sdk_devel/lib
      # HIPBLASLT_TENSILE_LIBPATH and ROCBLAS_TENSILE_LIBPATH are baked into
      # the image from ROCM_SDK_LIBRARIES_DIR so env.rocm713/env.rocm714 can
      # switch the ROCm SDK layout without runtime path overrides here.
      - GPU_MAX_HW_QUEUES=1
      # - VLLM_LOGGING_LEVEL=DEBUG
      # - VLLM_USE_NCCL_SYMM_MEM=1
      # - VLLM_DISABLE_PYNCCL=1
    command: >
      Qwen/Qwen3.6-27B-FP8
      --tokenizer Qwen/Qwen3.6-27B
      --served-model-name qwen3.6-27b
      --chat-template /app/chat-templates/qwen36.jinja
      --limit-mm-per-prompt '{"image": 99, "audio": 0, "video": 0}'
      --enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser qwen3
      --max-model-len 128000
      --enable-prefix-caching
      --override-generation-config '{"temperature": 1.0, "top_p": 0.95, "top_k": 20, "min_p": 0.0, "presence_penalty": 0.0, "repetition_penalty": 1.0}'
      --gpu-memory-utilization 0.93
      --host 0.0.0.0
      --port 8000

      --dtype auto
      --max-num-seqs 4
      --kv-cache-dtype fp8
      -tp 2
      --attention-backend ROCM_AITER_UNIFIED_ATTN
      --speculative-config '{"method": "mtp", "num_speculative_tokens": 3, "attention_backend": "ROCM_AITER_UNIFIED_ATTN"}'
    # --speculative-config '{"method": "mtp", "num_speculative_tokens": 3, "attention_backend": "ROCM_AITER_UNIFIED_ATTN"}'
    # --otlp-traces-endpoint http://aspire-dashboard:18890/v1/traces
    # --collect-detailed-traces=all

  vllm-mainline:
    profiles: ["vllm-mainline"]
    image: vllm/vllm-openai-rocm:v0.22.1
    container_name: vllm-mainline
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "video"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - label=disable
    ipc: host
    ports:
      - "8000:8000"
    # depends_on:
    #   - aspire-dashboard
    networks:
      default:
        aliases:
          - llm-backend
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface:Z
      - ./chat-templates/:/app/chat-templates:Z
      - ${HOME}/.cache/vllm:/root/.cache/vllm:Z
      - ${HOME}/.cache/triton:/root/.cache/triton:Z
      - ${HOME}/.cache/torchinductor:/root/.cache/torchinductor:Z

    env_file:
      - .env/2xr9700.vllm.common
      - .env/otel.common
      - .env/nccl-fix
    environment:
      - FLASH_ATTENTION_TRITON_AMD_ENABLE=TRUE
    # environment:
    #   - GPU_MAX_HW_QUEUES=1
    command: >
      Qwen/Qwen3.6-27B-FP8
      --tokenizer Qwen/Qwen3.6-27B
      --served-model-name qwen3.6-27b
      --chat-template /app/chat-templates/qwen36.jinja
      --limit-mm-per-prompt '{"image": 99, "audio": 0, "video": 0}'
      --enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser qwen3
      --max-model-len 128000
      --enable-prefix-caching
      --override-generation-config '{"temperature": 1.0, "top_p": 0.95, "top_k": 20, "min_p": 0.0, "presence_penalty": 0.0, "repetition_penalty": 1.0}'
      --gpu-memory-utilization 0.93
      --host 0.0.0.0
      --port 8000

      --dtype auto
      --max-num-seqs 4
      --kv-cache-dtype fp8
      -tp 2
      --speculative-config '{"method": "mtp", "num_speculative_tokens": 3}'
      --attention-backend TRITON_ATTN
    # --attention-backend ROCM_AITER_UNIFIED_ATTN
    # --otlp-traces-endpoint http://aspire-dashboard:18890/v1/traces
    # --collect-detailed-traces=all
    # --speculative-config '{"method": "mtp", "num_speculative_tokens": 3, "attention_backend": "ROCM_AITER_UNIFIED_ATTN"}'

  vllm-qwen36-27b-fp8-aml731:
    image: aml731/vllm-aiter:v0.20.2
    profiles: ["vllm-aml"]
    container_name: vllm-qwen36-27b-fp8-aml731
    group_add:
      - video
    ports:
      - "8000:8000"
    ipc: host
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface:Z
      - ./chat-templates/:/app/chat-templates:Z
      - ${HOME}/.cache/vllm:/root/.cache/vllm:Z
    networks:
      default:
        aliases:
          - llm-backend
    environment:
      - VLLM_ROCM_USE_AITER=1
      - VLLM_ROCM_ALLOW_RDNA4_AITER_ATTENTION=1
      - VLLM_ROCM_USE_AITER_UNIFIED_ATTENTION=1
      # - VLLM_V1_USE_PREFILL_DECODE_ATTENTION=0 # adding seems to slow down tg at 60000
      - VLLM_ROCM_USE_AITER_MHA=1
      - VLLM_ROCM_USE_AITER_PAGED_ATTN=0
      - VLLM_ROCM_USE_AITER_MOE=0
      - VLLM_ROCM_USE_AITER_LINEAR=0
      - FLASH_ATTENTION_TRITON_AMD_ENABLE=TRUE
      - PYTORCH_ALLOC_CONF=expandable_segments:True
      # --speculative-config '{"method":"mtp","num_speculative_tokens":3}'
    command: >
      python3 -m vllm.entrypoints.openai.api_server
      --model Qwen/Qwen3.6-27B-FP8
      --served-model-name qwen3.6-27b
      -tp 2
      --kv-cache-dtype fp8
      --dtype auto
      --attention-backend ROCM_AITER_UNIFIED_ATTN
      --compilation-config '{"pass_config":{"fuse_norm_quant":false}}'
      --max-model-len 128000
      --gpu-memory-utilization 0.95
      --enable-chunked-prefill
      --max-num-batched-tokens 8192
      --enable-prefix-caching
      --trust-remote-code
      --quantization fp8
      --max-num-seqs 4
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --reasoning-parser qwen3
      --host 0.0.0.0
      --port 8000
      --override-generation-config '{"temperature": 1.0, "top_p": 0.95, "top_k": 20, "min_p": 0.0, "presence_penalty": 0.0, "repetition_penalty": 1.0}'

  atom:
    profiles: ["atom"]
    image: docker.io/rocm/atom-dev:vllm-latest
    container_name: atom-dev
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "video"
      # - "render"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - label=disable
    ipc: host
    ports:
      - "8000:8000"
    networks:
      default:
        aliases:
          - llm-backend
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface:Z
      - ./chat-templates/:/app/chat-templates:Z

    env_file:
      - .env/2xr9700.vllm.common
      - .env/nccl-fix
    command: >
      vllm serve Qwen/Qwen3.6-27B-FP8
      --tokenizer Qwen/Qwen3.6-27B
      --served-model-name qwen3.6-27b
      --limit-mm-per-prompt '{"image": 0, "audio": 0, "video": 0}'
      --enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser qwen3
      --max-model-len 128000
      --enable-prefix-caching
      --max-num-seqs 4
      -tp 2
      --override-generation-config '{"temperature": 1.0, "top_p": 0.95, "top_k": 20, "min_p": 0.0, "presence_penalty": 0.0, "repetition_penalty": 1.0}'
      --gpu-memory-utilization 0.93
      --host 0.0.0.0
      --port 8000

  vllm-rocm-wheel:
    profiles: ["vllm-rocm-wheel"]
    image: localhost/vllm-rocm-wheel
    build:
      context: .
      dockerfile: docker/Dockerfile.wheel
      args:
        GFX_TARGET: gfx120X-all
        GFX_ARCH: gfx1201
        PYTHON: python3.12
        VLLM_WHEEL_URL: https://wheels.vllm.ai/rocm
        VLLM_VERSION: 0.21.0+rocm722
        ROCM_WHEEL_INDEX_URL: "${ROCM_WHEEL_INDEX_URL-https://rocm.nightlies.amd.com/whl-multi-arch/}"
        ROCM_SDK_CORE_VERSION: "${ROCM_SDK_CORE_VERSION-7.14.0a20260606}"
        ROCM_SDK_LIBRARIES_VERSION: "${ROCM_SDK_LIBRARIES_VERSION-7.14.0a20260606}"
        ROCM_SDK_LIBRARIES_PACKAGE: "${ROCM_SDK_LIBRARIES_PACKAGE-rocm-sdk-libraries}"
        ROCM_SDK_DEVICE_PACKAGE: "${ROCM_SDK_DEVICE_PACKAGE-rocm-sdk-device-gfx1201}"
        ROCM_SDK_LIBRARIES_DIR: "${ROCM_SDK_LIBRARIES_DIR-_rocm_sdk_libraries}"
        FLASH_ATTN_VERSION: 2.8.3
    container_name: vllm-rocm-wheel
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "video"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - label=disable
    ipc: host
    ports:
      - "8000:8000"
    # depends_on:
    #   - aspire-dashboard
    networks:
      default:
        aliases:
          - llm-backend
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface:Z
      - ./chat-templates/:/app/chat-templates:Z
      - ${HOME}/.cache/vllm:/root/.cache/vllm:Z

    env_file:
      - .env/2xr9700.vllm.common
      - .env/otel.common
    environment:
      - VLLM_ROCM_USE_AITER=0
    command: >
      Qwen/Qwen3.6-27B-FP8
      --tokenizer Qwen/Qwen3.6-27B
      --served-model-name qwen3.6-27b
      --chat-template /app/chat-templates/qwen36.jinja
      --limit-mm-per-prompt '{"image": 99, "audio": 0, "video": 0}'
      --enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser qwen3
      --max-model-len 128000
      --enable-prefix-caching
      --override-generation-config '{"temperature": 1.0, "top_p": 0.95, "top_k": 20, "min_p": 0.0, "presence_penalty": 0.0, "repetition_penalty": 1.0}'
      --gpu-memory-utilization 0.93
      --host 0.0.0.0
      --port 8000


      --dtype auto
      --max-num-seqs 4
      --kv-cache-dtype fp8
      -tp 2
      --speculative-config '{"method": "mtp", "num_speculative_tokens": 3}'
      --attention-backend TRITON_ATTN
    # --otlp-traces-endpoint http://aspire-dashboard:18890/v1/traces
    # --collect-detailed-traces=all

  ##########
  # llamacpp backends
  ##########

  llamacpp-rocm:
    image: ghcr.io/ggml-org/llama.cpp:server-rocm
    container_name: llamacpp-qwen36-rocm
    profiles: ["llamacpp-rocm"]
    ports:
      - "8000:8000"
    networks:
      default:
        aliases:
          - llm-backend
          - llamacpp
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "video"
      - "render"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - label=disable
    ipc: host
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface:Z
      - ${HOME}/.cache/llama.cpp:/root/.cache/llama.cpp:Z
    environment:
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=8000
      - LLAMA_API_KEY=sk-empty
      - LLAMA_ARG_ALIAS=qwen3.6-27b
      - LLAMA_ARG_UI=false

      - LLAMA_ARG_HF_REPO=unsloth/Qwen3.6-27B-MTP-GGUF:Q8_0

      - LLAMA_ARG_CTX_SIZE=128000

      # GPU/offload
      - HIP_VISIBLE_DEVICES=0,1
      - ROCR_VISIBLE_DEVICES=0,1
      - CUDA_VISIBLE_DEVICES=0,1
      # - LLAMA_ARG_TENSOR_SPLIT=1,1

      - LLAMA_ARG_TEMPERATURE=1.0
      - LLAMA_ARG_TOP_P=0.95
      - LLAMA_ARG_TOP_K=20
      - LLAMA_ARG_MIN_P=0.0
      - LLAMA_ARG_PRESENCE_PENALTY=0.0
      - LLAMA_ARG_REPEAT_PENALTY=1.0
    command: >
      --spec-type draft-mtp --spec-draft-n-max 3

  llamacpp-vulkan:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    container_name: llamacpp-qwen36-vulkan
    profiles: ["llamacpp-vulkan"]
    ports:
      - "8000:8000"
    networks:
      default:
        aliases:
          - llm-backend
          - llamacpp
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "video"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - label=disable
    ipc: host
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface:Z
      - ${HOME}/.cache/llama.cpp:/root/.cache/llama.cpp:Z
    environment:
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=8000
      - LLAMA_API_KEY=sk-empty
      - LLAMA_ARG_ALIAS=qwen3.6-27b-gguf
      - LLAMA_ARG_UI=false

      # - LLAMA_ARG_HF_REPO=unsloth/Qwen3.6-27B-MTP-GGUF:Q8_0
      - LLAMA_ARG_HF_REPO=unsloth/Qwen3.6-27B-GGUF:Q8_0

      - LLAMA_ARG_CTX_SIZE=128000

      # GPU/offload
      - HIP_VISIBLE_DEVICES=0,1
      - ROCR_VISIBLE_DEVICES=0,1
      - CUDA_VISIBLE_DEVICES=0,1
      # - LLAMA_ARG_TENSOR_SPLIT=1,1

      - LLAMA_ARG_TEMPERATURE=1.0
      - LLAMA_ARG_TOP_P=0.95
      - LLAMA_ARG_TOP_K=20
      - LLAMA_ARG_MIN_P=0.0
      - LLAMA_ARG_PRESENCE_PENALTY=0.0
      - LLAMA_ARG_REPEAT_PENALTY=1.0
    # command: >
    #   --spec-type draft-mtp --spec-draft-n-max 2

  ##########
  # tools and dashboards
  ##########

  chatui:
    image: ghcr.io/huggingface/chat-ui-db:latest
    container_name: chatui
    ports:
      - "8001:3000"
    environment:
      - OPENAI_BASE_URL=http://llm-backend:8000/v1
      - OPENAI_API_KEY=sk-empty
      - COOKIE_SECURE=false
      - PUBLIC_ORIGIN=http://hirose.local:8001
    volumes:
      - chat-ui-data:/data

  chatui-hermes:
    image: ghcr.io/huggingface/chat-ui-db:latest
    container_name: chatui-hermes
    profiles: ["hermes-agent"]
    ports:
      - "8004:3000"
    environment:
      - OPENAI_BASE_URL=http://hermes-agent:8642/v1
      - OPENAI_API_KEY=sk-empty
      - COOKIE_SECURE=false
      - PUBLIC_ORIGIN=http://hirose.local:8004
    volumes:
      - chat-ui-hermes-data:/data
    depends_on:
      -  hermes-agent

  hermes-agent:
    image: nousresearch/hermes-agent
    profiles: ["hermes-agent"]
    environment:
      - API_SERVER_ENABLED=true
      - API_SERVER_PORT=8642
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_KEY=sk-empty
      - GATEWAY_ALLOW_ALL_USERS=true
      - HERMES_YOLO_MODE=1
      # - HERMES_GATEWAY_NO_SUPERVISE=1
    volumes:
      - ${HOME}/.hermes:/opt/data:Z
    ports:
      - "8005:8642"
    # depends_on:
    #  - vllm-rocm-wheel-gfx12x-patched
    command: gateway

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: aspire-dashboard
    profiles:
      [
        "disabled"
        # "vllm-rocm-wheel",
        # "vllm-rocm-wheel-nightly",
        # "vllm-rocm-wheel-gfx12x-patched",
      ]
    ports:
