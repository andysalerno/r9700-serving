x-vllm-full-cache-volumes: &vllm_full_cache_volumes
  - ./chat-templates/:/app/chat-templates:Z
  - ${HOME}/.cache/huggingface:/root/.cache/huggingface:Z
  - ${HOME}/.cache/vllm:/root/.cache/vllm:Z
  - ${HOME}/.cache/triton:/root/.cache/triton:Z
  - ${HOME}/.cache/triton:/root/.triton:Z
  - ${HOME}/.cache/torchinductor:/root/.cache/torchinductor:Z
  - ${HOME}/.cache/aiter:/root/.aiter:Z
  - ${HOME}/.cache/comgr:/root/.cache/comgr:Z
  - ${HOME}/.cache/tvm-ffi:/root/.cache/tvm-ffi:Z

x-llamacpp-cache-volumes: &llamacpp_cache_volumes
  - ${HOME}/.cache/huggingface:/root/.cache/huggingface:Z
  - ${HOME}/.cache/llama.cpp:/root/.cache/llama.cpp:Z

x-amd-devices: &amd_devices
  devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
  group_add:
    - "video"
  cap_add:
    - SYS_PTRACE
  security_opt:
    - label=disable
  ipc: host

services:
  vllm:
    <<: *amd_devices
    image: localhost/vllm-fullbuild:${VLLM_IMAGE_TAG:?set VLLM_IMAGE_TAG in env/env.fullbuild}
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile.fullbuild
      args:
        ROCM_IMAGE: ${ROCM_IMAGE}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL}
        GPU_ARCH: ${GPU_ARCH}
        MAX_JOBS: ${MAX_JOBS}
        TORCH_VERSION: ${TORCH_VERSION}
        TORCHVISION_VERSION: ${TORCHVISION_VERSION}
        TORCHAUDIO_VERSION: ${TORCHAUDIO_VERSION}
        TRITON_VERSION: ${TRITON_VERSION}
        VLLM_REPO: ${VLLM_REPO}
        VLLM_REF: ${VLLM_REF}
        VLLM_VERSION: ${VLLM_VERSION}
        AITER_REF: ${AITER_REF}
        FLASH_ATTN_REF: ${FLASH_ATTN_REF}
    container_name: vllm
    # This host's Ryzen 9 9900X3D: CPUs 0-5,12-17 are the CCD with 3D V-cache.
    # On the other CCD the engine's per-step host work runs slower; decode at
    # four requests drops from ~210 to ~160 tok/s when the scheduler spreads it.
    cpuset: "0-5,12-17"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10m
    networks:
      default:
        aliases:
          - llm-backend
    volumes: *vllm_full_cache_volumes
    env_file:
      - env/2xr9700.vllm.common
    environment:
      # RCCL peer-to-peer over PCIe through cuMem memory; legacy HIP IPC fails
      # on these GPUs. Graph buffer registration breaks CUDA graph capture.
      - NCCL_CUMEM_ENABLE=1
      - NCCL_GRAPH_REGISTER=0
      # vLLM's compile step points Triton's kernel cache at the inductor cache,
      # by default under /tmp in the container; keep it on the mounted host
      # cache so compiled kernels survive restarts.
      - TORCHINDUCTOR_CACHE_DIR=/root/.cache/torchinductor
    # A 786,432-token context fits with the DSpark draft at 2048-token prefill
    # chunks (1024 fits more but prefills 7-10% slower at 8-32K); three draft
    # tokens are the fastest on two R9700s (the checkpoint's block drafts up to
    # seven).
    command: >
      thinkingmachines/Inkling-2-Mini
      --served-model-name inkling-2-mini
      --enable-auto-tool-choice --tool-call-parser inkling --reasoning-parser inkling
      --default-chat-template-kwargs '{"reasoning_effort": "medium"}'
      --max-model-len 786432
      --max-num-batched-tokens 2048
      --max-num-seqs 4
      --enable-prefix-caching
      --enable-prompt-tokens-details
      --host 0.0.0.0
      --port 8000
      -tp 2
      --speculative-config '{"method": "dspark", "num_speculative_tokens": 3, "draft_sample_method": "probabilistic"}'

  ##########
  # tools and dashboards
  ##########

  chatui:
    image: ${CHATUI_IMAGE:?set CHATUI_IMAGE in env/env.fullbuild}
    container_name: chatui
    depends_on:
      vllm:
        condition: service_healthy
    ports:
      - "8001:3000"
    environment:
      - OPENAI_BASE_URL=http://llm-backend:8000/v1
      - OPENAI_API_KEY=sk-empty
      - COOKIE_SECURE=false
      - PUBLIC_ORIGIN=http://hirose.local:8001
    volumes:
      - chat-ui-data:/data

volumes:
  chat-ui-data:

