services:
  vllm-qwen36-r9700:
    # image: localhost/vllm-rocm-wheel:gfx120x
    profiles: ["vllm-rocm"]
    image: docker.io/vllm/vllm-openai-rocm:nightly
    # image: docker.io/rocm/vllm:rocm7.13.0_gfx120X-all_ubuntu24.04_py3.13_pytorch_2.10.0_vllm_0.19.1
    container_name: vllm-qwen36-r9700
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      # Host ROCm device groups; Docker Compose via Podman treats keep-groups
      # as a literal image group, so use numeric GIDs for portability here.
      # - keep-groups
      # - "482" # video: /dev/dri/card*
      # - "485" # render: /dev/kfd and /dev/dri/renderD*
      - "video"
      # - "render"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - label=disable
    ipc: host
    ports:
      - "8000:8000"
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface:Z
      - ./chat-templates/:/app/chat-templates:Z
      - ${HOME}/.cache/vllm:/root/.cache/vllm:Z
      # - ${HOME}/.cache/triton:/root/.cache/triton:Z
      # - ${HOME}/.cache/torch:/root/.cache/torch:Z

    environment:
      # https://rocm.docs.amd.com/en/latest/how-to/rocm-for-ai/inference-optimization/vllm-optimization.html
      HIP_VISIBLE_DEVICES: "0,1"
      ROCR_VISIBLE_DEVICES: "0,1"
      CUDA_VISIBLE_DEVICES: "0,1"
      NCCL_SOCKET_IFNAME: "lo"
      NCCL_PROTO: "Simple"
      NCCL_P2P_DISABLE: "1"
      NCCL_SHM_DISABLE: "0"
      VLLM_ROCM_USE_AITER: "0"
      GPU_ARCHS: "gfx1201"
      # FLASH_ATTENTION_TRITON_AMD_ENABLE: "TRUE"
      # TRITON_CACHE_DIR: "/root/.cache/triton"
      # TORCHINDUCTOR_CACHE_DIR: "/root/.cache/torch/inductor"
      # Qwen/Qwen3.6-35B-A3B-FP8
      # --served-model-name qwen3.6-35b-a3b-fp8
      # --speculative-config '{"method": "mtp", "num_speculative_tokens": 2}'
      # --speculative-config '{"method": "ngram", "num_speculative_tokens": 4, "prompt_lookup_min": 2, "prompt_lookup_max": 5}'
    command: >
      Qwen/Qwen3.6-27B-FP8
      --tokenizer Qwen/Qwen3.6-27B
      --served-model-name qwen3.6-27b-fp8
      --chat-template /app/chat-templates/qwen36.jinja
      --limit-mm-per-prompt '{"image": 0, "audio": 0, "video": 0}'
      --enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser qwen3
      --max-model-len 128000
      --enable-prefix-caching
      --dtype auto
      --block-size 16
      --kv-cache-dtype auto
      --attention-backend TRITON_ATTN
      -tp 2
      --override-generation-config '{"temperature": 1.0, "top_p": 0.95, "top_k": 20, "min_p": 0.0, "presence_penalty": 0.0, "repetition_penalty": 1.0}'
      --max-num-seqs 4
      --performance-mode interactivity
      --gpu-memory-utilization 0.93
      --host 0.0.0.0
      --port 8000
  llamacpp-rocm:
    image: ghcr.io/ggml-org/llama.cpp:server-rocm
    container_name: llamacpp-qwen36-rocm
    profiles: ["llamacpp-rocm"]
    ports:
      - "8000:8080"
    networks:
      default:
        aliases:
          - llamacpp
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "video"
      # On your host this may be needed too; use numeric GID if Podman Compose dislikes names.
      # - "render"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - label=disable
    ipc: host
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface:Z
      - ${HOME}/.cache/llama.cpp:/root/.cache/llama.cpp:Z
    environment:
      LLAMA_ARG_HOST: "0.0.0.0"
      LLAMA_ARG_PORT: "8000"
      LLAMA_API_KEY: "sk-empty"
      LLAMA_ARG_ALIAS: "qwen3.6-27b-gguf"
      LLAMA_ARG_UI: "false"

      LLAMA_ARG_HF_REPO: "unsloth/Qwen3.6-27B-GGUF:Q8_0"

      # Rough equivalents to your vLLM serving config
      LLAMA_ARG_CTX_SIZE: "128000"
      # LLAMA_ARG_N_PARALLEL: "4"
      # LLAMA_ARG_CONT_BATCHING: "1"
      # LLAMA_ARG_BATCH: "2048"
      # LLAMA_ARG_UBATCH: "512"
      # LLAMA_ARG_CACHE_PROMPT: "1"
      # LLAMA_ARG_ENDPOINT_METRICS: "1"
      # LLAMA_ARG_ENDPOINT_SLOTS: "1"

      # GPU/offload
      HIP_VISIBLE_DEVICES: "0,1"
      ROCR_VISIBLE_DEVICES: "0,1"
      CUDA_VISIBLE_DEVICES: "0,1"
      # LLAMA_ARG_DEVICE: "0,1"
      # LLAMA_ARG_N_GPU_LAYERS: "all"
      # LLAMA_ARG_SPLIT_MODE: "layer"
      # LLAMA_ARG_TENSOR_SPLIT: "1,1"
      # LLAMA_ARG_FLASH_ATTN: "auto"

      # Sampling defaults close to your vLLM override
      LLAMA_ARG_TEMPERATURE: "1.0"
      LLAMA_ARG_TOP_P: "0.95"
      LLAMA_ARG_TOP_K: "20"
      LLAMA_ARG_MIN_P: "0.0"
      LLAMA_ARG_PRESENCE_PENALTY: "0.0"
      LLAMA_ARG_REPEAT_PENALTY: "1.0"

  chatui:
    # depends_on:
    #   - vllm-qwen36-r9700
    image: ghcr.io/huggingface/chat-ui-db:latest
    container_name: chatui
    ports:
      - "8001:3000"
    environment:
      # OPENAI_BASE_URL: "http://vllm-qwen36-r9700:8000/v1"
      OPENAI_BASE_URL: "http://llamacpp-qwen36-rocm:8000/v1"
      OPENAI_API_KEY: "sk-empty"
      COOKIE_SECURE: "false"
      PUBLIC_ORIGIN: "http://hirose.local:8001"
    volumes:
      - chat-ui-data:/data
volumes:
  chat-ui-data: