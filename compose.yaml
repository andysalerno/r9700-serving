x-vllm-full-cache-volumes: &vllm_full_cache_volumes
  - ./chat-templates/:/app/chat-templates
  - ./fused_moe_configs/:/app/fused_moe_configs
  - ${HOME}/.cache/huggingface:/root/.cache/huggingface
  - ${HOME}/.cache/vllm:/root/.cache/vllm
  - ${HOME}/.cache/triton:/root/.cache/triton
  - ${HOME}/.cache/torchinductor:/root/.cache/torchinductor
  - ${HOME}/.cache/aiter:/root/.aiter
  - ${HOME}/.cache/comgr:/root/.cache/comgr
  - ${HOME}/.cache/tvm-ffi:/root/.cache/tvm-ffi

x-llamacpp-cache-volumes: &llamacpp_cache_volumes
  - ${HOME}/.cache/huggingface:/root/.cache/huggingface
  - ${HOME}/.cache/llama.cpp:/root/.cache/llama.cpp

x-amd-devices: &amd_devices
  devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
  group_add:
    - "video"
  cap_add:
    - SYS_PTRACE
  security_opt:
    - label=disable
  ipc: host

services:
  vllm:
    <<: *amd_devices
    # image: vllm/vllm-openai-rocm:v0.25.1
    # image: docker.io/rocm/vllm:rocm7.14.0_rdna_ubuntu24.04_py3.14_pytorch_2.11.0_vllm_0.23.0
    image: localhost/vllm-fullbuild:latest
    build:
      context: .
      dockerfile: Dockerfile.fullbuild
      args:
        ROCM_IMAGE: ${ROCM_IMAGE}
        GPU_ARCH: ${GPU_ARCH}
        MAX_JOBS: ${MAX_JOBS}
        TORCH_VERSION: ${TORCH_VERSION}
        TORCHVISION_VERSION: ${TORCHVISION_VERSION}
        TORCHAUDIO_VERSION: ${TORCHAUDIO_VERSION}
        VLLM_REF: ${VLLM_REF}
        VLLM_VERSION: ${VLLM_VERSION}
        AITER_REF: ${AITER_REF}
        FLASH_ATTN_REF: ${FLASH_ATTN_REF}
    container_name: vllm
    restart: unless-stopped
    ports:
      - "8180:8180"
    networks:
      default:
        aliases:
          - llm-backend
    volumes: *vllm_full_cache_volumes
    env_file:
      - env/2xr9700.vllm.common
      - env/aiter-unified-attention.env
    environment:
      - GPU_MAX_HW_QUEUES=1
      - NCCL_P2P_DISABLE=1
      - VLLM_TUNED_CONFIG_FOLDER=/app/fused_moe_configs
    command: >
      Qwen/Qwen3.6-35B-A3B-FP8
      --tokenizer Qwen/Qwen3.6-35B-A3B
      --served-model-name qwen3.6-35b-a3b
      --chat-template /app/chat-templates/qwen36.jinja
      --limit-mm-per-prompt '{"image": 99, "audio": 0, "video": 0}'
      --enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser qwen3
      --default-chat-template-kwargs '{"preserve_thinking": false}'
      --max-model-len 128000
      --max-num-batched-tokens 4096
      --enable-prefix-caching
      --override-generation-config '{"temperature": 1.0, "top_p": 0.95, "top_k": 20, "min_p": 0.0, "presence_penalty": 0.0, "repetition_penalty": 1.0}'
      --gpu-memory-utilization 0.9
      --host 0.0.0.0
      --port 8180
      --dtype auto
      --max-num-seqs 4
      --kv-cache-dtype auto
      -tp 2
      --attention-backend ROCM_AITER_UNIFIED_ATTN
      --speculative-config '{"method": "mtp", "num_speculative_tokens": 4, "attention_backend": "ROCM_AITER_UNIFIED_ATTN"}'

  # Alternate model (dense; uncomment to switch):
  # Qwen/Qwen3.6-27B-FP8
  # --tokenizer Qwen/Qwen3.6-27B
  # --served-model-name qwen3.6-27b
  # --speculative-config '{"method": "mtp", "num_speculative_tokens": 4, "attention_backend": "ROCM_AITER_UNIFIED_ATTN"}'

