services:
  vllm-qwen36-r9700:
    image: docker.io/vllm/vllm-openai-rocm:v0.20.2
    container_name: vllm-qwen36-r9700
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      # Host ROCm device groups; Docker Compose via Podman treats keep-groups
      # as a literal image group, so use numeric GIDs for portability here.
      # - keep-groups
      # - "482" # video: /dev/dri/card*
      # - "485" # render: /dev/kfd and /dev/dri/renderD*
      - "video"
    security_opt:
      - label=disable
    ipc: host
    network_mode: host
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface:Z
      - ${HOME}/.cache/vllm:/root/.cache/vllm:Z
      - ${HOME}/.cache/triton:/root/.cache/triton:Z
      - ${HOME}/.cache/torch:/root/.cache/torch:Z
    environment:
      HIP_VISIBLE_DEVICES: 0,1
      ROCR_VISIBLE_DEVICES: 0,1
      CUDA_VISIBLE_DEVICES: 0,1
      NCCL_SOCKET_IFNAME: lo
      NCCL_PROTO: Simple
      NCCL_P2P_DISABLE: "1"
      NCCL_SHM_DISABLE: "0"
      TRITON_CACHE_DIR: /root/.cache/triton
      TORCHINDUCTOR_CACHE_DIR: /root/.cache/torch/inductor
    command: >
      Qwen/Qwen3.6-35B-A3B-FP8
      --served-model-name qwen3.6-35b-a3b-fp8
      --enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser qwen3
      --enable-prefix-caching
      --tensor-parallel-size 2
      --distributed-executor-backend mp
      --gpu-memory-utilization 0.93
      --max-model-len 128000
      --host 0.0.0.0
      --port 8000