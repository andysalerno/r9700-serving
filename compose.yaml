x-amd-devices: &amd_devices
  devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
  group_add:
    - "video"
  cap_add:
    - SYS_PTRACE
  security_opt:
    - label=disable
  ipc: host

services:
  inkling:
    <<: *amd_devices
    image: localhost/llama-cpp-inkling:${LLAMA_CPP_VERSION:?set LLAMA_CPP_VERSION in env/env.inkling}
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile.inkling
      args:
        ROCM_IMAGE: ${ROCM_IMAGE}
        GPU_ARCH: ${GPU_ARCH}
        MAX_JOBS: ${MAX_JOBS}
        LLAMA_CPP_BASE_COMMIT: ${LLAMA_CPP_BASE_COMMIT}
        LLAMA_CPP_TREE: ${LLAMA_CPP_TREE}
        UNSLOTH_LLAMA_CPP_COMMIT: ${UNSLOTH_LLAMA_CPP_COMMIT}
        ADDITIVE_MERGE_SHA256: ${ADDITIVE_MERGE_SHA256}
    container_name: inkling
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5m
    networks:
      default:
        aliases:
          - llm-backend
    volumes:
      - ${HOME}/.cache/llama.cpp/inkling-2-mini/${INKLING_GGUF_REVISION}:/models:ro,Z
    environment:
      # ROCm device 2 is the CPU's integrated GPU; 0 and 1 are the R9700s.
      - HIP_VISIBLE_DEVICES=0,1
    command: >
      --model /models/${INKLING_MODEL_FILE}
      --mmproj /models/${INKLING_MMPROJ_FILE}
      --alias inkling-2-mini
      --jinja
      --host 0.0.0.0
      --port 8000
      --n-gpu-layers 99
      --split-mode layer
      --tensor-split 14,10
      --ctx-size 1048576
      --parallel 1
      --batch-size 4096
      --ubatch-size 1024
      --flash-attn on
      --temp 1.0 --top-p 1.0 --top-k 0 --min-p 0.0

  ##########
  # tools and dashboards
  ##########

  chatui:
    image: ${CHATUI_IMAGE:?set CHATUI_IMAGE in env/env.inkling}
    container_name: chatui
    depends_on:
      inkling:
        condition: service_healthy
    ports:
      - "8001:3000"
    environment:
      - OPENAI_BASE_URL=http://llm-backend:8000/v1
      - OPENAI_API_KEY=sk-empty
      - COOKIE_SECURE=false
      - PUBLIC_ORIGIN=http://hirose.local:8001
    volumes:
      - chat-ui-data:/data

volumes:
  chat-ui-data:

