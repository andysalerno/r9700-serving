services:
  vllm-qwen36-r9700:
    profiles: ["vllm-rocm"]
    image: docker.io/vllm/vllm-openai-rocm:nightly
    container_name: vllm-qwen36-r9700
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "video"
      - "render"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - label=disable
    ipc: host
    ports:
      - "8000:8000"
    networks:
      default:
        aliases:
          - llm-backend
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface:Z
      - ./chat-templates/:/app/chat-templates:Z
      - ${HOME}/.cache/vllm:/root/.cache/vllm:Z
      # - ${HOME}/.cache/triton:/root/.cache/triton:Z
      # - ${HOME}/.cache/torch:/root/.cache/torch:Z

    environment:
      # https://rocm.docs.amd.com/en/latest/how-to/rocm-for-ai/inference-optimization/vllm-optimization.html
      HIP_VISIBLE_DEVICES: "0,1"
      ROCR_VISIBLE_DEVICES: "0,1"
      CUDA_VISIBLE_DEVICES: "0,1"
      NCCL_SOCKET_IFNAME: "lo"
      NCCL_PROTO: "Simple"
      NCCL_P2P_DISABLE: "1"
      NCCL_SHM_DISABLE: "0"
      # VLLM_ROCM_USE_AITER: "0"
      # GPU_ARCHS: "gfx1201"
      # FLASH_ATTENTION_TRITON_AMD_ENABLE: "TRUE"
      # TRITON_CACHE_DIR: "/root/.cache/triton"
      # TORCHINDUCTOR_CACHE_DIR: "/root/.cache/torch/inductor"
      # Qwen/Qwen3.6-35B-A3B-FP8
      # --served-model-name qwen3.6-35b-a3b-fp8
      # --speculative-config '{"method": "mtp", "num_speculative_tokens": 2}'
      # --speculative-config '{"method": "ngram", "num_speculative_tokens": 4, "prompt_lookup_min": 2, "prompt_lookup_max": 5}'
      # Qwen/Qwen3.6-27B-FP8
      # --kv-cache-dtype fp8
    command: >
      QuantTrio/Qwen3.6-27B-AWQ
      --tokenizer Qwen/Qwen3.6-27B
      --served-model-name qwen3.6-27b
      --chat-template /app/chat-templates/qwen36.jinja
      --limit-mm-per-prompt '{"image": 0, "audio": 0, "video": 0}'
      --enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser qwen3
      --max-model-len 128000
      --enable-prefix-caching
      --dtype auto
      -tp 2
      --override-generation-config '{"temperature": 1.0, "top_p": 0.95, "top_k": 20, "min_p": 0.0, "presence_penalty": 0.0, "repetition_penalty": 1.0}'
      --max-num-seqs 4
      --gpu-memory-utilization 0.93
      --host 0.0.0.0
      --port 8000
  vllm-wheel-v2-qwen36-r9700:
    profiles: ["vllm-rocm-wheel"]
    image: localhost/vllm-rocm-wheel
    build:
      context: .
      dockerfile: docker/Dockerfile.wheel
      args:
        GFX_TARGET: gfx120X-all
        GFX_ARCH: gfx1201
        PYTHON: python3.12
        VLLM_WHEEL_URL: https://wheels.vllm.ai/rocm
        VLLM_VERSION: 0.21.0+rocm722
        FLASH_ATTN_VERSION: 2.8.3
    container_name: vllm-wheel-v2-qwen36-r9700
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "video"
      - "render"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - label=disable
    ipc: host
    ports:
      - "8000:8000"
    networks:
      default:
        aliases:
          - llm-backend
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface:Z
      - ./chat-templates/:/app/chat-templates:Z
      - ${HOME}/.cache/vllm:/root/.cache/vllm:Z
      # - ${HOME}/.cache/triton:/root/.cache/triton:Z
      # - ${HOME}/.cache/torch:/root/.cache/torch:Z

    environment:
      # https://rocm.docs.amd.com/en/latest/how-to/rocm-for-ai/inference-optimization/vllm-optimization.html
      HIP_VISIBLE_DEVICES: "0,1"
      ROCR_VISIBLE_DEVICES: "0,1"
      CUDA_VISIBLE_DEVICES: "0,1"
      HIP_PLATFORM: "amd"
      VLLM_TARGET_DEVICE: "rocm"
      VLLM_ROCM_GCN_ARCH: "gfx1201"
      PYTORCH_ROCM_ARCH: "gfx1201"
      HIP_ARCHITECTURES: "gfx1201"
      AMDGPU_TARGETS: "gfx1201"
      GPU_ARCHS: "gfx1201"
      # NCCL_SOCKET_IFNAME: "lo"
      # NCCL_PROTO: "Simple"
      # NCCL_P2P_DISABLE: "1"
      # NCCL_SHM_DISABLE: "0"
      VLLM_ROCM_USE_AITER: "1"
      FLASH_ATTENTION_TRITON_AMD_ENABLE: "TRUE"
      VLLM_LOGGING_LEVEL: DEBUG
      # TRITON_CACHE_DIR: "/root/.cache/triton"
      # TORCHINDUCTOR_CACHE_DIR: "/root/.cache/torch/inductor"
      # Qwen/Qwen3.6-35B-A3B-FP8
      # --served-model-name qwen3.6-35b-a3b-fp8
      # --speculative-config '{"method": "mtp", "num_speculative_tokens": 2}'
      # --speculative-config '{"method": "ngram", "num_speculative_tokens": 4, "prompt_lookup_min": 2, "prompt_lookup_max": 5}'
      # Qwen/Qwen3.6-27B-FP8
      # --kv-cache-dtype fp8
      # btbtyler09/Qwen3.6-27B-GPTQ-8bit
      # raydelossantos/Qwen3.6-27B-GPTQ-Int4
      # QuantTrio/Qwen3.6-27B-AWQ
    command: >
      Qwen/Qwen3.6-27B-FP8
      --tokenizer Qwen/Qwen3.6-27B
      --served-model-name qwen3.6-27b
      --chat-template /app/chat-templates/qwen36.jinja
      --limit-mm-per-prompt '{"image": 0, "audio": 0, "video": 0}'
      --enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser qwen3
      --max-model-len 128000
      --enable-prefix-caching
      --dtype auto
      -tp 2
      --override-generation-config '{"temperature": 1.0, "top_p": 0.95, "top_k": 20, "min_p": 0.0, "presence_penalty": 0.0, "repetition_penalty": 1.0}'
      --max-num-seqs 4
      --gpu-memory-utilization 0.93
      --host 0.0.0.0
      --port 8000
  rocm-vllm-nightly-qwen36-r9700:
    profiles: ["vllm-rocm-nightly"]
    # image: docker.io/rocm/vllm-dev:nightly
    image: docker.io/rocm/vllm:rocm7.13.0_gfx120X-all_ubuntu24.04_py3.13_pytorch_2.10.0_vllm_0.19.1
    container_name: rocm-vllm-nightly-qwen36-r9700
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "video"
      - "render"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - label=disable
    ipc: host
    ports:
      - "8000:8000"
    networks:
      default:
        aliases:
          - llm-backend
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface:Z
      - ./chat-templates/:/app/chat-templates:Z
      - ${HOME}/.cache/vllm:/root/.cache/vllm:Z

    environment:
      # https://rocm.docs.amd.com/en/latest/how-to/rocm-for-ai/inference-optimization/vllm-optimization.html
      # FLASH_ATTENTION_TRITON_AMD_ENABLE: "TRUE"
      HIP_VISIBLE_DEVICES: "0,1"
      ROCR_VISIBLE_DEVICES: "0,1"
      CUDA_VISIBLE_DEVICES: "0,1"
      # NCCL_SOCKET_IFNAME: "lo"
      # NCCL_PROTO: "Simple"
      # NCCL_P2P_DISABLE: "1"
      # NCCL_SHM_DISABLE: "0"
      VLLM_ROCM_USE_AITER: "1"
    command: >
      vllm serve
      QuantTrio/Qwen3.6-27B-AWQ
      --tokenizer Qwen/Qwen3.6-27B
      --served-model-name qwen3.6-27b-fp8
      --chat-template /app/chat-templates/qwen36.jinja
      --language-model-only
      --enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser qwen3
      --max-model-len 128000
      --enable-prefix-caching
      --dtype auto
      --kv-cache-dtype fp8
      -tp 2
      --override-generation-config '{"temperature": 1.0, "top_p": 0.95, "top_k": 20, "min_p": 0.0, "presence_penalty": 0.0, "repetition_penalty": 1.0}'
      --max-num-seqs 4
      --gpu-memory-utilization 0.93
      --host 0.0.0.0
      --port 8000
  llamacpp-rocm:
    image: ghcr.io/ggml-org/llama.cpp:server-rocm
    container_name: llamacpp-qwen36-rocm
    profiles: ["llamacpp-rocm"]
    ports:
      - "8000:8000"
    networks:
      default:
        aliases:
          - llm-backend
          - llamacpp
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "video"
      - "render"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - label=disable
    ipc: host
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface:Z
      - ${HOME}/.cache/llama.cpp:/root/.cache/llama.cpp:Z
    environment:
      LLAMA_ARG_HOST: "0.0.0.0"
      LLAMA_ARG_PORT: "8000"
      LLAMA_API_KEY: "sk-empty"
      LLAMA_ARG_ALIAS: "qwen3.6-27b-gguf"
      LLAMA_ARG_UI: "false"

      LLAMA_ARG_HF_REPO: "unsloth/Qwen3.6-27B-MTP-GGUF:Q8_0"

      LLAMA_ARG_CTX_SIZE: "128000"

      # GPU/offload
      HIP_VISIBLE_DEVICES: "0,1"
      ROCR_VISIBLE_DEVICES: "0,1"
      CUDA_VISIBLE_DEVICES: "0,1"
      # LLAMA_ARG_TENSOR_SPLIT: "1,1"

      LLAMA_ARG_TEMPERATURE: "1.0"
      LLAMA_ARG_TOP_P: "0.95"
      LLAMA_ARG_TOP_K: "20"
      LLAMA_ARG_MIN_P: "0.0"
      LLAMA_ARG_PRESENCE_PENALTY: "0.0"
      LLAMA_ARG_REPEAT_PENALTY: "1.0"
    command: >
      --spec-type draft-mtp --spec-draft-n-max 3

  llamacpp-vulkan:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    container_name: llamacpp-qwen36-vulkan
    profiles: ["llamacpp-vulkan"]
    ports:
      - "8000:8000"
    networks:
      default:
        aliases:
          - llm-backend
          - llamacpp
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "video"
      - "render"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - label=disable
    ipc: host
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface:Z
      - ${HOME}/.cache/llama.cpp:/root/.cache/llama.cpp:Z
    environment:
      LLAMA_ARG_HOST: "0.0.0.0"
      LLAMA_ARG_PORT: "8000"
      LLAMA_API_KEY: "sk-empty"
      LLAMA_ARG_ALIAS: "qwen3.6-27b-gguf"
      LLAMA_ARG_UI: "false"

      # LLAMA_ARG_HF_REPO: "unsloth/Qwen3.6-27B-MTP-GGUF:Q8_0"
      LLAMA_ARG_HF_REPO: "unsloth/Qwen3.6-27B-GGUF:Q8_0"

      LLAMA_ARG_CTX_SIZE: "128000"

      # GPU/offload
      HIP_VISIBLE_DEVICES: "0,1"
      ROCR_VISIBLE_DEVICES: "0,1"
      CUDA_VISIBLE_DEVICES: "0,1"
      # LLAMA_ARG_TENSOR_SPLIT: "1,1"

      LLAMA_ARG_TEMPERATURE: "1.0"
      LLAMA_ARG_TOP_P: "0.95"
      LLAMA_ARG_TOP_K: "20"
      LLAMA_ARG_MIN_P: "0.0"
      LLAMA_ARG_PRESENCE_PENALTY: "0.0"
      LLAMA_ARG_REPEAT_PENALTY: "1.0"
    # command: >
    #   --spec-type draft-mtp --spec-draft-n-max 2

  chatui:
    image: ghcr.io/huggingface/chat-ui-db:latest
    container_name: chatui
    ports:
      - "8001:3000"
    environment:
      OPENAI_BASE_URL: "http://llm-backend:8000/v1"
      OPENAI_API_KEY: "sk-empty"
      COOKIE_SECURE: "false"
      PUBLIC_ORIGIN: "http://hirose.local:8001"
    volumes:
      - chat-ui-data:/data
volumes:
  chat-ui-data: