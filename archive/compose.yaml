x-vllm-full-cache-volumes: &vllm_full_cache_volumes
  - ./chat-templates/:/app/chat-templates:Z
  - ${HOME}/.cache/huggingface:/root/.cache/huggingface:Z
  - ${HOME}/.cache/vllm:/root/.cache/vllm:Z
  - ${HOME}/.cache/triton:/root/.cache/triton:Z
  - ${HOME}/.cache/triton:/root/.triton:Z
  - ${HOME}/.cache/torchinductor:/root/.cache/torchinductor:Z
  - ${HOME}/.cache/aiter:/root/.aiter:Z
  - ${HOME}/.cache/comgr:/root/.cache/comgr:Z
  - ${HOME}/.cache/tvm-ffi:/root/.cache/tvm-ffi:Z


x-llamacpp-cache-volumes: &llamacpp_cache_volumes
  - ${HOME}/.cache/huggingface:/root/.cache/huggingface:Z
  - ${HOME}/.cache/llama.cpp:/root/.cache/llama.cpp:Z

x-amd-devices: &amd_devices
  devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
  group_add:
    - "video"
  cap_add:
    - SYS_PTRACE
  security_opt:
    - label=disable
  ipc: host

services:
  vllm-rocm-wheel:
    <<: *amd_devices
    profiles: ["vllm-rocm-wheel", "vllm-rocm-wheel-nightly"]
    image: ${VLLM_BASE_IMAGE:-localhost/vllm-rocm-wheel:manual-unpatched}
    # image: docker.io/vllm/vllm-openai-rocm:nightly
    build:
      context: .
      dockerfile: docker/Dockerfile.wheel
      args:
        GFX_TARGET: gfx120X-all
        GFX_ARCH: gfx1201
        PYTHON: python3.12
        VLLM_WHEEL_URL: "${VLLM_WHEEL_URL:?set VLLM_WHEEL_URL with --env-file .env/env.vllm.latest or nightly}"
        VLLM_VERSION: "${VLLM_VERSION:?set VLLM_VERSION with --env-file .env/env.vllm.latest or nightly}"
        ROCM_WHEEL_INDEX_URL: "${ROCM_WHEEL_INDEX_URL-https://rocm.nightlies.amd.com/whl-multi-arch/}"
        ROCM_SDK_CORE_VERSION: "${ROCM_SDK_CORE_VERSION:?set ROCM_SDK_CORE_VERSION with --env-file .env/env.rocm715, .env/env.rocm714, or .env/env.rocm713}"
        ROCM_SDK_LIBRARIES_VERSION: "${ROCM_SDK_LIBRARIES_VERSION:?set ROCM_SDK_LIBRARIES_VERSION with --env-file .env/env.rocm715, .env/env.rocm714, or .env/env.rocm713}"
        ROCM_SDK_LIBRARIES_PACKAGE: "${ROCM_SDK_LIBRARIES_PACKAGE:?set ROCM_SDK_LIBRARIES_PACKAGE with --env-file .env/env.rocm715, .env/env.rocm714, or .env/env.rocm713}"
        ROCM_SDK_DEVICE_PACKAGE: "${ROCM_SDK_DEVICE_PACKAGE?set ROCM_SDK_DEVICE_PACKAGE with --env-file .env/env.rocm715, .env/env.rocm714, or .env/env.rocm713}"
        ROCM_SDK_LIBRARIES_DIR: "${ROCM_SDK_LIBRARIES_DIR:?set ROCM_SDK_LIBRARIES_DIR with --env-file .env/env.rocm715, .env/env.rocm714, or .env/env.rocm713}"
        FLASH_ATTN_VERSION: 2.8.3
    container_name: ${VLLM_BASE_CONTAINER_NAME:-vllm-rocm-wheel-manual-unpatched}
    ports:
      - "8000:8000"
    # depends_on:
    #   - aspire-dashboard
    networks:
      default:
        aliases:
          - llm-backend
    volumes: *vllm_full_cache_volumes
    env_file:
      - .env/2xr9700.vllm.common
      - .env/otel.common
    environment:
      - FLASH_ATTENTION_TRITON_AMD_ENABLE=TRUE
    command: >
      Qwen/Qwen3.6-27B-FP8
      --tokenizer Qwen/Qwen3.6-27B
      --served-model-name qwen3.6-27b
      --chat-template /app/chat-templates/qwen36.jinja
      --limit-mm-per-prompt '{"image": 99, "audio": 0, "video": 0}'
      --enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser qwen3
      --max-model-len 128000
      --enable-prefix-caching
      --override-generation-config '{"temperature": 1.0, "top_p": 0.95, "top_k": 20, "min_p": 0.0, "presence_penalty": 0.0, "repetition_penalty": 1.0}'
      --gpu-memory-utilization 0.93
      --host 0.0.0.0
      --port 8000

      --dtype auto
      --max-num-seqs 4
      --kv-cache-dtype fp8
      --speculative-config '{"method": "mtp", "num_speculative_tokens": 3}'
      -tp 2

  vllm-rocm-wheel-gfx12x-patched:
    <<: *amd_devices
    profiles: ["vllm-rocm-wheel-gfx12x-patched"]
    image: ${VLLM_PATCHED_IMAGE:-localhost/vllm-rocm-wheel:manual-gfx12x-patched}
    build:
      context: .
      dockerfile: docker/Dockerfile.wheel-gfx12x-patched
      args:
        BASE_IMAGE: ${VLLM_PATCHED_BASE_IMAGE:-localhost/vllm-rocm-wheel:manual-unpatched}
        ROCM_WHEEL_INDEX_URL: "${ROCM_WHEEL_INDEX_URL-https://rocm.nightlies.amd.com/whl-multi-arch/}"
        ROCM_SDK_DEVEL_VERSION: "${ROCM_SDK_DEVEL_VERSION:?set ROCM_SDK_DEVEL_VERSION with --env-file .env/env.rocm715, .env/env.rocm714, or .env/env.rocm713}"
        ROCM_SDK_LIBRARIES_DIR: "${ROCM_SDK_LIBRARIES_DIR:?set ROCM_SDK_LIBRARIES_DIR with --env-file .env/env.rocm715, .env/env.rocm714, or .env/env.rocm713}"
        USE_LATEST_AITER: "${USE_LATEST_AITER:?set USE_LATEST_AITER with --env-file .env/env.aiter.bundled or .env/env.aiter.latest}"
        AITER_LATEST_WHEEL_URL:
        AITER_LATEST_FLYDSL_WHEEL_URL:
    container_name: ${VLLM_PATCHED_CONTAINER_NAME:-vllm-rocm-wheel-manual-gfx12x-patched}
    ports:
      - "8000:8000"
    # depends_on:
    #   - aspire-dashboard
    networks:
      default:
        aliases:
          - llm-backend
    volumes: *vllm_full_cache_volumes

    env_file:
      - .env/2xr9700.vllm.common
      - .env/aiter-unified-attention.env
      - .env/otel.common
    environment:
      - GPU_MAX_HW_QUEUES=1
      # - VLLM_LOGGING_LEVEL=DEBUG
      # - VLLM_USE_NCCL_SYMM_MEM=1
      # - VLLM_DISABLE_PYNCCL=1
    command: >
      Qwen/Qwen3.6-27B-FP8
      --tokenizer Qwen/Qwen3.6-27B
      --served-model-name qwen3.6-27b
      --chat-template /app/chat-templates/qwen36.jinja
      --limit-mm-per-prompt '{"image": 99, "audio": 0, "video": 0}'
      --enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser qwen3
      --default-chat-template-kwargs '{"preserve_thinking": false}'
      --max-model-len 128000
      --enable-prefix-caching
      --override-generation-config '{"temperature": 1.0, "top_p": 0.95, "top_k": 20, "min_p": 0.0, "presence_penalty": 0.0, "repetition_penalty": 1.0}'
      --gpu-memory-utilization 0.93
      --host 0.0.0.0
      --port 8000
      --dtype auto
      --max-num-seqs 4
      --kv-cache-dtype fp8
      -tp 2
      --attention-backend ROCM_AITER_UNIFIED_ATTN
      --speculative-config '{"method": "mtp", "num_speculative_tokens": 3, "attention_backend": "ROCM_AITER_UNIFIED_ATTN"}'

  vllm-mainline:
    <<: *amd_devices
    profiles: ["vllm-mainline"]
    # image: vllm/vllm-openai-rocm:v0.25.1
    # image: docker.io/rocm/vllm:rocm7.14.0_rdna_ubuntu24.04_py3.14_pytorch_2.11.0_vllm_0.23.0
    image: localhost/vllm-fullbuild:review
    container_name: vllm-mainline
    ports:
      - "8000:8000"
    # depends_on:
    #   - aspire-dashboard
    networks:
      default:
        aliases:
          - llm-backend
    volumes: *vllm_full_cache_volumes

    env_file:
      - .env/2xr9700.vllm.common
      - .env/aiter-unified-attention.env
      - .env/otel.common
    environment:
      - GPU_MAX_HW_QUEUES=1
      - NCCL_P2P_DISABLE=1
      # - VLLM_LOGGING_LEVEL=DEBUG
      # - VLLM_USE_NCCL_SYMM_MEM=1
      # - VLLM_DISABLE_PYNCCL=1
      # --attention-backend ROCM_AITER_UNIFIED_ATTN
      # --speculative-config '{"method": "mtp", "num_speculative_tokens": 3, "attention_backend": "ROCM_AITER_UNIFIED_ATTN"}'
    command: >
      Qwen/Qwen3.6-27B-FP8
      --tokenizer Qwen/Qwen3.6-27B
      --served-model-name qwen3.6-27b
      --chat-template /app/chat-templates/qwen36.jinja
      --limit-mm-per-prompt '{"image": 99, "audio": 0, "video": 0}'
      --enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser qwen3
      --default-chat-template-kwargs '{"preserve_thinking": false}'
      --max-model-len 128000
      --enable-prefix-caching
      --override-generation-config '{"temperature": 1.0, "top_p": 0.95, "top_k": 20, "min_p": 0.0, "presence_penalty": 0.0, "repetition_penalty": 1.0}'
      --gpu-memory-utilization 0.93
      --host 0.0.0.0
      --port 8000
      --dtype auto
      --max-num-seqs 4
      --kv-cache-dtype fp8
      -tp 2
      --attention-backend ROCM_AITER_UNIFIED_ATTN
      --speculative-config '{"method": "mtp", "num_speculative_tokens": 3, "attention_backend": "ROCM_AITER_UNIFIED_ATTN"}'

  ##########
  # llamacpp backends
  ##########

  llamacpp-rocm:
    image: ghcr.io/ggml-org/llama.cpp:server-rocm
    container_name: llamacpp-qwen36-rocm
    <<: *amd_devices
    profiles: ["llamacpp-rocm"]
    ports:
      - "8000:8000"
    networks:
      default:
        aliases:
          - llm-backend
          - llamacpp
    volumes: *llamacpp_cache_volumes
    environment:
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=8000
      - LLAMA_API_KEY=sk-empty
      - LLAMA_ARG_ALIAS=qwen3.6-27b
      - LLAMA_ARG_UI=false

      - LLAMA_ARG_HF_REPO=unsloth/Qwen3.6-27B-MTP-GGUF:Q8_0

      - LLAMA_ARG_CTX_SIZE=128000

      # GPU/offload
      - HIP_VISIBLE_DEVICES=0,1
      - ROCR_VISIBLE_DEVICES=0,1
      # - LLAMA_ARG_TENSOR_SPLIT=1,1

      - LLAMA_ARG_TEMPERATURE=1.0
      - LLAMA_ARG_TOP_P=0.95
      - LLAMA_ARG_TOP_K=20
      - LLAMA_ARG_MIN_P=0.0
      - LLAMA_ARG_PRESENCE_PENALTY=0.0
      - LLAMA_ARG_REPEAT_PENALTY=1.0
    command: >
      --spec-type draft-mtp --spec-draft-n-max 3

  llamacpp-vulkan:
    <<: *amd_devices
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    container_name: llamacpp-qwen36-vulkan
    profiles: ["llamacpp-vulkan"]
    ports:
      - "8000:8000"
    networks:
      default:
        aliases:
          - llm-backend
          - llamacpp
    volumes: *llamacpp_cache_volumes
    environment:
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=8000
      - LLAMA_API_KEY=sk-empty
      - LLAMA_ARG_ALIAS=qwen3.6-27b-gguf
      - LLAMA_ARG_UI=false

      # - LLAMA_ARG_HF_REPO=unsloth/Qwen3.6-27B-MTP-GGUF:Q8_0
      - LLAMA_ARG_HF_REPO=unsloth/Qwen3.6-27B-GGUF:Q8_0

      - LLAMA_ARG_CTX_SIZE=128000

      # GPU/offload
      - HIP_VISIBLE_DEVICES=0,1
      - ROCR_VISIBLE_DEVICES=0,1
      # - LLAMA_ARG_TENSOR_SPLIT=1,1

      - LLAMA_ARG_TEMPERATURE=1.0
      - LLAMA_ARG_TOP_P=0.95
      - LLAMA_ARG_TOP_K=20
      - LLAMA_ARG_MIN_P=0.0
      - LLAMA_ARG_PRESENCE_PENALTY=0.0
      - LLAMA_ARG_REPEAT_PENALTY=1.0
    # command: >
    #   --spec-type draft-mtp --spec-draft-n-max 2

  ##########
  # tools and dashboards
  ##########

  chatui:
    image: ghcr.io/huggingface/chat-ui-db:latest
    container_name: chatui
    profiles: ["vllm-rocm-wheel", "vllm-rocm-wheel-nightly", "vllm-rocm-wheel-gfx12x-patched", "vllm-mainline"]
    ports:
      - "8001:3000"
    environment:
      - OPENAI_BASE_URL=http://llm-backend:8000/v1
      - OPENAI_API_KEY=sk-empty
      - COOKIE_SECURE=false
      - PUBLIC_ORIGIN=http://hirose.local:8001
    volumes:
      - chat-ui-data:/data

  chatui-hermes:
    image: ghcr.io/huggingface/chat-ui-db:latest
    container_name: chatui-hermes
    profiles: ["hermes-agent"]
    ports:
      - "8004:3000"
    environment:
      - OPENAI_BASE_URL=http://hermes-agent:8642/v1
      - OPENAI_API_KEY=sk-empty
      - COOKIE_SECURE=false
      - PUBLIC_ORIGIN=http://hirose.local:8004
    volumes:
      - chat-ui-hermes-data:/data
    depends_on:
      -  hermes-agent

  hermes-agent:
    image: nousresearch/hermes-agent
    profiles: ["hermes-agent"]
    environment:
      - API_SERVER_ENABLED=true
      - API_SERVER_PORT=8642
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_KEY=sk-empty
      - GATEWAY_ALLOW_ALL_USERS=true
      - HERMES_YOLO_MODE=1
      # - HERMES_GATEWAY_NO_SUPERVISE=1
    volumes:
      - ${HOME}/.hermes:/opt/data:Z
    ports:
      - "8005:8642"
    # depends_on:
    #  - vllm-rocm-wheel-gfx12x-patched
    command: gateway

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: aspire-dashboard
    profiles:
      [
        "disabled"
        # "vllm-rocm-wheel",
        # "vllm-rocm-wheel-gfx12x-patched",
      ]
    ports:
      - "8002:18888"
      - "4317:18889"
      - "4318:18890"
    environment:
      - ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true
    volumes:
      - aspire-dashboard-dp-keys:/home/app/.aspnet/DataProtection-Keys

volumes:
  chat-ui-data:
  chat-ui-hermes-data:
  aspire-dashboard-dp-keys:

